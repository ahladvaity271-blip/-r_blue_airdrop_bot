<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>R Blue Airdrop</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="//libtl.com/sdk.js" data-zone="11755684" data-sdk="show_11755684"></script>

<style>
body{margin:0;padding:24px 16px;font-family:Arial,sans-serif;text-align:center;background:#f5f5f5}
.card{max-width:430px;margin:20px auto;padding:30px 20px;background:#fff;border-radius:20px;box-shadow:0 5px 20px rgba(0,0,0,.10)}
h1{margin:0 0 14px;font-size:30px} p{font-size:17px;line-height:1.45}
button{margin-top:12px;padding:14px 26px;border:0;border-radius:12px;font-size:17px;cursor:pointer}
button:disabled{opacity:.55}
#status{margin-top:20px;font-size:15px;word-break:break-word}
.small{font-size:13px;opacity:.65}
</style>
</head>

<body>
<div class="card">
<h1>🎁 Earn Coins</h1>
<p>Watch an advertisement to earn a reward.</p>
<button id="watchAd">📺 Watch Ad</button>
<div id="status">Ready.</div>
<p class="small">Monetag Zone: 11755684</p>
</div>

<script>
try {
  if (window.Telegram && Telegram.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
} catch(e) { console.log(e); }

const button = document.getElementById("watchAd");
const status = document.getElementById("status");

button.addEventListener("click", async function() {
  button.disabled = true;
  status.textContent = "⏳ Loading advertisement...";

  try {
    if (typeof window.show_11755684 !== "function") {
      throw new Error("Monetag SDK function was not loaded. Check HTTPS hosting and the SDK tag.");
    }

    await window.show_11755684();
    status.textContent = "✅ Advertisement completed! Reward earned.";
  } catch(error) {
    console.error("Monetag error:", error);
    status.textContent = "❌ Advertisement could not be shown. " +
      (error && error.message ? error.message : String(error));
  } finally {
    button.disabled = false;
  }
});
</script>
</body>
</html>
