<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Earn Coins</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Monetag SDK -->
  <script src="//libtl.com/sdk.js" data-zone="11755684" data-sdk="show_11755684"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      margin: 0;
    }
    .card {
      max-width: 420px;
      margin: auto;
      padding: 28px 20px;
      border-radius: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }
    button {
      border: 0;
      border-radius: 12px;
      padding: 14px 24px;
      font-size: 17px;
      cursor: pointer;
    }
    #status {
      margin-top: 18px;
      min-height: 24px;
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>🎁 Earn Coins</h2>
    <p>Watch an advertisement to earn a reward.</p>

    <button id="watchAd">📺 Watch Ad</button>

    <p id="status"></p>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const button = document.getElementById("watchAd");
    const status = document.getElementById("status");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Loading advertisement...";

      try {
        await show_11755684();

        // IMPORTANT:
        // This is only a client-side success message.
        // Do not treat it as a secure/real balance update.
        status.textContent = "✅ Ad completed! Reward earned.";
      } catch (error) {
        console.error(error);
        status.textContent = "❌ Advertisement could not be shown.";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
